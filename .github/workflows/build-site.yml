name: Build website

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-site.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Mochi
        run: node build.mjs

      - name: Save generated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            version.json \
            sw.js \
            manifest.json \
            notice.json \
            icon-180.png \
            icon-192.png \
            icon-512.png \
            icon-maskable-512.png

          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: update generated website"
            git push
          fi
